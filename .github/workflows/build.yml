name: Build

on:
  push:
    branches: [main]
    tags: ['*-v*']          # 예: pick-v1.0.0 → 펼쳐 뽑기 앱 출시 빌드
  pull_request:
  workflow_dispatch:

permissions:
  contents: write           # 태그 빌드 때 GitHub Release에 파일 첨부

jobs:
  # main 푸시 / PR: 모든 앱 테스트용 APK
  debug:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [pick]       # 새 앱 추가 시 여기에도 이름 추가
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle :apps:${{ matrix.app }}:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-debug-apk
          path: apps/${{ matrix.app }}/build/outputs/apk/debug/*.apk

  # main 푸시: 디버그 APK를 apk 브랜치에 올려 고정 링크로 받을 수 있게 함
  #   https://github.com/<저장소>/raw/apk/<앱>-debug.apk
  publish-apk:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: '*-debug-apk'
      - name: Push APKs to apk branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir site
          for d in out/*-debug-apk; do
            app=$(basename "$d" -debug-apk)
            cp "$d"/*.apk "site/$app-debug.apk"
          done
          cd site
          {
            echo "# 테스트용 디버그 APK (테스트 광고)"
            echo
            echo "빌드 커밋: ${GITHUB_SHA::7} / $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
            echo
            for f in *.apk; do echo "- [$f](https://github.com/${GITHUB_REPOSITORY}/raw/apk/$f)"; done
          } > README.md
          git init -q -b apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "debug APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk

  # 태그 <앱>-v<버전>: 그 앱만 서명된 출시 빌드 (AAB + APK)
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Parse tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          APP="${TAG%%-v*}"
          VER="${TAG#*-v}"
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "APP_UPPER=$(echo "$APP" | tr '[:lower:]' '[:upper:]')" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets[format('{0}_KEYSTORE_BASE64', env.APP_UPPER)] }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ${APP_UPPER}_KEYSTORE_BASE64 이 없습니다"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed release
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.tag.outputs.version }}
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets[format('{0}_KEYSTORE_PASSWORD', env.APP_UPPER)] }}
          KEY_ALIAS: ${{ secrets[format('{0}_KEY_ALIAS', env.APP_UPPER)] }}
          KEY_PASSWORD: ${{ secrets[format('{0}_KEY_PASSWORD', env.APP_UPPER)] }}
          ADMOB_APP_ID: ${{ secrets[format('{0}_ADMOB_APP_ID', env.APP_UPPER)] }}
          ADMOB_BANNER_ID: ${{ secrets[format('{0}_ADMOB_BANNER_ID', env.APP_UPPER)] }}
        run: gradle :apps:${{ steps.tag.outputs.app }}:bundleRelease :apps:${{ steps.tag.outputs.app }}:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}
          path: |
            apps/${{ steps.tag.outputs.app }}/build/outputs/bundle/release/*.aab
            apps/${{ steps.tag.outputs.app }}/build/outputs/apk/release/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/${{ steps.tag.outputs.app }}/build/outputs/bundle/release/*.aab
            apps/${{ steps.tag.outputs.app }}/build/outputs/apk/release/*.apk
